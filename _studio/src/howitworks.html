<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>body{width:1280px;height:720px}
#stage{position:absolute;left:330px;top:40px;width:910px;height:600px;overflow:hidden;background:#07060c;box-shadow:inset 0 0 0 1px #2e2646;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
#stage img{position:absolute;left:0;top:0;width:910px;transform-origin:0 0}
#rail{position:absolute;left:40px;top:60px;width:260px}
.st{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid #2e2646;opacity:.35;transition:none}
.st b{font-family:Michroma;font-size:14px;color:#776e8f;min-width:28px}.st .t{font-family:Michroma;font-size:15px;text-transform:uppercase;line-height:1.3}.st .d{font-size:14px;color:#b3aac9;margin-top:4px;line-height:1.4}
.st.on{opacity:1}.st.on b{color:#14f195}
#prog{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#14f195,#9945ff,#dc1fff)}
.full{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07060c;z-index:50}
</style><body><div class="amb"></div><div class="scan"></div>
<div id="rail"></div><div id="stage"></div><div id="prog"></div>
<div class="full" id="intro"><div><div class="mi" style="font-size:22px;letter-spacing:.3em;color:#776e8f">HOW IT WORKS</div><div class="mi" style="font-size:60px;margin-top:20px">Launch a coin <span class="iri">with a brain.</span></div><div style="font-size:22px;color:#b3aac9;margin-top:18px">six steps · real screens · synapsepad.net</div></div></div>
<div class="full" id="outro"><div><div class="mi" style="font-size:46px">Your coin trades. <span class="iri">Then buys itself back.</span></div><div style="font-size:22px;letter-spacing:.2em;color:#b3aac9;margin-top:24px">synapsepad.net · @SynapsePadSOL</div></div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x*x*(3-2*x)};
// [start, image, step, title, detail, [zoom, fx, fy]]
const S=[[2,'02-deposit','01','Deposit SOL','your wallet signs a transfer, verified on Solana',[1.25,.3,.35]],
[5.2,'03-launch','02','Launch','name it, pick a brain, seed it from 0.2 SOL',[1.2,.72,.45]],
[8.4,'04-coin','03','It goes live','coin on a curve, agent with a treasury',[1.15,.4,.3]],
[11.4,'05-buy','04','Anyone can buy','1% fee: half straight to the agent',[1.35,.82,.35]],
[14.4,'06-thoughts','05','The brain trades','every 5s on the live tape, every move explained',[1.2,.45,.4]],
[17.4,'07-ward','06','The ward ranks it','new highs buy the coin back',[1.1,.5,.4]],[20.4]];
const END=20.4,DUR=22.5;
$('rail').innerHTML=S.slice(0,-1).map((s,i)=>`<div class="st" id="r${i}"><b>${s[2]}</b><div><div class="t">${s[3]}</div><div class="d">${s[4]}</div></div></div>`).join('');
S.slice(0,-1).forEach((s,i)=>{const im=new Image();im.src='../shots2/'+s[1]+'.png';im.id='i'+i;$('stage').appendChild(im);});
const W=910,H=600,IH=910*860/1440;
const tf=(z,p)=>{const s=1+(z[0]-1)*p;let x=W/2-z[1]*W*s,y=H/2-z[2]*IH*s;x=Math.min(0,Math.max(W-W*s,x));y=Math.min(0,Math.max(H-IH*s,y));return `translate(${x}px,${y}px) scale(${s})`;};
window.__seek=(t)=>{
  $('intro').style.opacity=1-e((t-1.5)/.5);$('outro').style.opacity=e((t-END)/.5);$('prog').style.width=(t/DUR*1280)+'px';
  let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i][0])k=i;
  S.slice(0,-1).forEach((s,i)=>{const im=$('i'+i);im.style.opacity=i<=k?e((t-s[0])/.4):0;im.style.zIndex=i;const len=S[i+1][0]-s[0];im.style.transform=tf(s[5],e((t-s[0]-.2)/(len*.7)));$('r'+i).className='st'+(i===k?' on':'');});
};window.__ready=Promise.all([...document.images].map((i)=>i.decode().catch(()=>0)));window.__seek(0);
</script>
